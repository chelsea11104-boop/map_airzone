<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Kualitas Udara Jawa Barat, DKI Jakarta dan Banten</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6ef;
    }
    h1 {
      text-align: center;
      background-color: #3e5dda;
      color: white;
      padding: 10px 0;
      margin: 0;
    }
    #map {
      height: 90vh;
      width: 100%;
    }
    .leaflet-popup-content {
      font-size: 14px;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      line-height: 1.6;
      color: #333;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
    }
    .legend h4 {
      margin: 0 0 6px;
      font-size: 13px;
      text-align: left;
    }
    .legend i {
      width: 16px;
      height: 16px;
      float: left;
      margin-right: 8px;
      opacity: 0.9;
    }

    .locate-btn {
      position: absolute;
      bottom: 100px;
      right: 20px;
      background: #3e5dda;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: background 0.3s;
    }
    .locate-btn:hover {
      background: #2f49b5;
    }

    .pulse {
      width: 20px;
      height: 20px;
      background: rgba(52, 152, 219, 0.6);
      border: 3px solid #3498db;
      border-radius: 50%;
      position: absolute;
      transform: translate(-10px, -10px);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: translate(-10px, -10px) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-10px, -10px) scale(2.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>AirZone 🌫 | Peta Kualitas Udara Jawa Barat, DKI Jakarta dan Banten</h1>
  <div id="map"></div>
  <button class="locate-btn" id="locateBtn">📍</button>

  <script>
    // ===============================
    // DATA TITIK MANUAL
    // ===============================
    const titikData = [
      { lokasi: "Margadadi", kabupaten: "Kabupaten Indramayu", latitude: -6.321389, longitude: 108.335278, pm25: 20.2, pm10: 25.9, o3: 45, no2: 13.5, so2: 12.9, co: "-" },
      { lokasi: "Sadang", kabupaten: "Purwakarta", latitude: -6.510727, longitude: 107.456232, pm25: 15.4, pm10: 19.8, o3: 32, no2: 19.4, so2: 9.2, co: 278.6 },
      { lokasi: "Saguling", kabupaten: "Bandung Barat", latitude: -6.890111, longitude: 107.385639, pm25: 14.9, pm10: 27.5, o3: 20, no2: 53.9, so2: 8.5, co: "-" },
      { lokasi: "Sukamahi", kabupaten: "Kabupaten Bekasi", latitude: -6.375833, longitude: 107.180833, pm25: 30.5, pm10: 33.9, o3: 59, no2: 10.5, so2: 2.0, co: "-" },
      { lokasi: "Cisarua", kabupaten: "Kabupaten Bogor", latitude: -6.676111, longitude: 106.937222, pm25: 4.4, pm10: 5.9, o3: 109, no2: 92.6, so2: 91.6, co: "-" },
      { lokasi: "Pelabuhanratu", kabupaten: "Kabupaten Sukabumi", latitude: -6.988056, longitude: 106.55, pm25: 11.2, pm10: 15.5, o3: 55, no2: 9.5, so2: 9.3, co: 210.7 },
      { lokasi: "Bantar Gebang", kabupaten: "Kota Bekasi", latitude: -6.311612, longitude: 106.986038, pm25: 31.1, pm10: 49.4, o3: 91, no2: 82.9, so2: 143.6, co: 343.1 },
      { lokasi: "Tegar Beriman, Cibinong", kabupaten: "Kabupaten Bogor", latitude: -6.481222, longitude: 106.823306, pm25: 12.8, pm10: 5.6, o3: 17, no2: 70.7, so2: "-", co: "-" },
      { lokasi: "Tanah Sareal", kabupaten: "Kota Bogor", latitude: -6.568332, longitude: 106.800032, pm25: 0.7, pm10: 21.0, o3: 136, no2: 20.0, so2: 135.6, co: 395.2 },
      { lokasi: "Leuwiliang", kabupaten: "Kabupaten Bogor", latitude: -6.564722, longitude: 106.629167, pm25: 16.8, pm10: 30.1, o3: 60, no2: 1.3, so2: 10.2, co: "-" }
    ];

    // ===============================
    // INISIALISASI MAP
    // ===============================
    const map = L.map("map").setView([-6.9, 107.6], 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    // ===============================
    // LOAD GEOJSON BATAS KECAMATAN + WARNA BERBEDA
    // ===============================
    function getRandomColor() {
      return "#" + Math.floor(Math.random() * 16777215).toString(16);
    }

    fetch("batas_kecamatan.geojson")
      .then((res) => res.json())
      .then((geoData) => {
        console.log("GeoJSON berhasil dimuat:", geoData);
        L.geoJSON(geoData, {
          style: function (feature) {
            return {
              color: "#000", // garis tepi hitam
              weight: 1,
              fillColor: getRandomColor(),
              fillOpacity: 0.4,
            };
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<b>${feature.properties.name}</b>`);
            }
          },
        }).addTo(map);
      })
      .catch((err) => console.error("Gagal load batas kecamatan:", err));

    // Fungsi warna PM2.5
    function getColor(pm25) {
      if (pm25 <= 15.5) return "#2ECC71";
      else if (pm25 <= 55.4) return "#F1C40F";
      else if (pm25 <= 150.4) return "#E67E22";
      else if (pm25 <= 250.4) return "#E74C3C";
      else return "#2C3E50";
    }
        
    // ===============================
    // WARNA MARKER BERDASARKAN PM2.5
    // ===============================
    function getColor(pm25) {
      if (pm25 <= 15.5) return "#2ECC71";
      else if (pm25 <= 55.4) return "#F1C40F";
      else if (pm25 <= 150.4) return "#E67E22";
      else if (pm25 <= 250.4) return "#E74C3C";
      else return "#2C3E50";
    }

    function createColoredMarker(color) {
      const markerHtmlStyles = `
        background-color: ${color};
        width: 1.2rem;
        height: 1.2rem;
        display: block;
        left: -0.6rem;
        top: -0.6rem;
        position: relative;
        border-radius: 1.2rem 1.2rem 0;
        transform: rotate(45deg);
        border: 2px solid #ffffff;
      `;
      return L.divIcon({
        className: "custom-pin",
        iconAnchor: [0, 0],
        popupAnchor: [0, -5],
        html: `<span style="${markerHtmlStyles}" />`,
      });
    }

    // ===============================
    // TAMPILKAN SEMUA TITIK
    // ===============================
    titikData.forEach((item) => {
      const warna = getColor(item.pm25);

      const marker = L.marker([item.latitude, item.longitude], {
        icon: createColoredMarker(warna),
      }).addTo(map);

      marker.bindPopup(`
        <b>${item.lokasi}</b><br>
        ${item.kabupaten}<br><br>
        <b>PM2.5:</b> ${item.pm25} µg/m³<br>
        <b>PM10:</b> ${item.pm10} µg/m³<br>
        <b>O₃:</b> ${item.o3} µg/m³<br>
        <b>NO₂:</b> ${item.no2} µg/m³<br>
        <b>SO₂:</b> ${item.so2} µg/m³<br>
        <b>CO:</b> ${item.co} µg/m³
      `);
    });

    // ===============================
    // LEGENDA
    // ===============================
    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML += "<h4>Kategori Udara (PM2.5)</h4>";
      div.innerHTML += '<i style="background:#2ECC71"></i>Baik (0–15.5)<br>';
      div.innerHTML += '<i style="background:#F1C40F"></i>Sedang (15.6–55.4)<br>';
      div.innerHTML += '<i style="background:#E67E22"></i>Tidak Sehat (55.5–150.4)<br>';
      div.innerHTML += '<i style="background:#E74C3C"></i>Sangat Tidak Sehat (150.5–250.4)<br>';
      div.innerHTML += '<i style="background:#2C3E50"></i>Berbahaya (>250.5)<br>';
      return div;
    };
    legend.addTo(map);

    // ===============================
    // LOKASI PENGGUNA
    // ===============================
    let userMarker = null;
    let pulseMarker = null;
    let trackingActive = false;
    let currentPosition = null;

    function updateUserLocation(lat, lon) {
      currentPosition = [lat, lon];

      if (userMarker) {
        userMarker.setLatLng(currentPosition);
        pulseMarker.setLatLng(currentPosition);
      } else {
        userMarker = L.circleMarker(currentPosition, {
          radius: 6,
          fillColor: "#3498DB",
          color: "#fff",
          weight: 2,
          opacity: 1,
          fillOpacity: 1,
        }).addTo(map);

        const pulseDiv = L.divIcon({
          className: "pulse",
          iconSize: [20, 20],
        });

        pulseMarker = L.marker(currentPosition, { icon: pulseDiv }).addTo(map);
      }
    }

    document.getElementById("locateBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Browser kamu tidak mendukung fitur lokasi!");
        return;
      }

      if (!trackingActive) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            updateUserLocation(latitude, longitude);
          },
          (err) => alert("Gagal mendapatkan lokasi: " + err.message),
          { enableHighAccuracy: true }
        );
        trackingActive = true;
      }

      if (currentPosition) {
        map.setView(currentPosition, 14);
      }
    });
  </script>
</body>
</html>
